# OpenEvolve configuration for evolving the IPCP prefetcher via CMU's LiteLLM gateway.
#
# API key is read from OPENAI_API_KEY env var (see .env.example).
#
# Usage:
#   export OPENAI_API_KEY=sk-...
#   openevolve-run openevolve/initial_ipcp.cc openevolve/evaluator_ipcp.py \
#                  --config openevolve/config_ipcp.yaml --iterations 20

max_iterations: 20
checkpoint_interval: 5
language: cpp

llm:
  primary_model: "gpt-5-mini"
  primary_model_weight: 1.0
  api_base: "https://ai-gateway.andrew.cmu.edu"
  temperature: 0.7
  max_tokens: 8000
  timeout: 120

prompt:
  system_message: |
    You are an expert computer architect specializing in memory prefetcher design.
    You are evolving an IP-Classifier Prefetcher (IPCP) for the L2 cache in ChampSim.
    Only modify the code inside the EVOLVE-BLOCK markers. You may change:
      - Degree constants (CS_DEGREE, CPLX_DEGREE, GS_DEGREE, NL_DEGREE): how many
        lines to prefetch per access for each IP class. Higher degree increases
        coverage but risks cache pollution.
      - Confidence thresholds (CS_CONFIDENCE_THRESHOLD, CPLX_CONFIDENCE_THRESHOLD):
        how many consistent stride observations are required before classifying an IP
        as Constant Stride (CS) or Complex (CPLX). Lower thresholds react faster but
        misclassify more.
      - STREAM_DETECT_THRESHOLD: how many more positive (or negative) accesses than
        negative (or positive) are needed to declare a global stream direction.
      - CONFIDENCE_SAT_MAX: ceiling for the saturating confidence counter.
      - MSHR_THRESHOLD: fraction of MSHR entries that must be free before issuing
        fill-level (demand-path) prefetches; reduces memory bandwidth pressure.
      - The classify_ip() function logic: the four classes are
          CS   — constant stride (same delta every access)
          CPLX — complex/irregular stride (variable but predictable via signature)
          GS   — global stream (most IPs moving in the same direction)
          NL   — next-line fallback
        You may redesign the classification heuristic, add hysteresis, combine
        classes, or change how confidence interacts with class promotion/demotion.
    Keep all existing variable names and types so the rest of the code compiles.
    Goal: maximize IPC while keeping prefetch accuracy high (avoid cache pollution).

database:
  population_size: 30
  archive_size: 10
  num_islands: 2
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7

evaluator:
  timeout: 360
  parallel_evaluations: 1

diff_based_evolution: true
max_code_length: 8000
